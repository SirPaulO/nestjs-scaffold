# SonarQube configuration - GENERIC backend-skeleton template.
# Cloned service repos MUST replace sonar.projectKey (and sonar.projectName) with the
# project provisioned for that service on the Sonar server. Analysis runs in CI
# (.github/workflows/sonar.yml); the scanner reads this file.

# Placeholder key - no real Sonar project is provisioned for the template itself.
sonar.projectKey=Nube-Ink_backend-skeleton
sonar.projectName=backend-skeleton

# SonarQube Cloud (sonarcloud.io) requires the organization key - uncomment for Cloud.
# For a self-hosted SonarQube Server, leave this commented and set SONAR_HOST_URL in CI.
# sonar.organization=nube-ink

# Sources vs tests: production code lives in src/, every spec lives under test/ (never beside source).
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.ts

# Coverage: Jest writes lcov to .coverage/ via `npm run test:cov` (jest coverageDirectory).
sonar.javascript.lcov.reportPaths=.coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Files excluded from analysis entirely (build output, deps, coverage artifacts).
sonar.exclusions=dist/**,node_modules/**,.coverage/**

# Coverage-metric exclusions mirror the skeleton's jest config (collectCoverageFrom
# !src/main.ts + coveragePathIgnorePatterns for generated DB assets).
sonar.coverage.exclusions=src/main.ts,src/database/migrations/**,src/database/seeds/**,src/database/factories/**

# The Quality Gate is enforced by the sonarqube-quality-gate-action step in sonar.yml
# (which owns the wait + timeout), so sonar.qualitygate.wait is intentionally not set here.

sonar.sourceEncoding=UTF-8

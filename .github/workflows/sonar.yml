name: Sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Sonar can assign new-code/blame data to the right commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:cov

      - name: SonarQube scan
        # Skip cleanly when Sonar isn't configured (e.g. forks) instead of failing red,
        # mirroring the sentry-sourcemaps workflow's guard.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

      - name: SonarQube Quality Gate
        # Same guard as the scan: no token -> no analysis -> no report-task.txt to gate on.
        # Reads .scannerwork/report-task.txt from the scan step and fails the job if the
        # gate fails. This step owns the wait + timeout (in place of sonar.qualitygate.wait).
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
